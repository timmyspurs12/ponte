name: Application quality
on:
  pull_request:
    branches: [main]
  push:
    branches: [arena/c2b1a150-ponte]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ponte
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ponte_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ponte -d ponte_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgres://ponte:ci-only-password@localhost:5432/ponte_test
      PONTE_DEV_AUTH: '1'
      PONTE_DEV_TOKEN: ci-only-not-a-production-credential-000000000000
      PONTE_DEV_BUSINESS_ID: 00000000-0000-4000-8000-000000000001
      PONTE_DEV_USER_ID: 00000000-0000-4000-8000-000000000002
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:seed
      - run: npm run db:migrate
      - run: npm run test:backend
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: application-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
