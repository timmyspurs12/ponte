name: Application quality
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, arena/40fa34c0-ponte]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ponte
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ponte_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ponte -d ponte_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgres://ponte:ci-only-password@localhost:5432/ponte_test
      PONTE_DEV_AUTH: '1'
      PONTE_DEV_TOKEN: ci-only-not-a-production-credential-000000000000
      PONTE_DEV_BUSINESS_ID: 00000000-0000-4000-8000-000000000001
      PONTE_DEV_USER_ID: 00000000-0000-4000-8000-000000000002
    steps:
      # Actions are pinned to immutable commit SHAs, not mutable tags: a tag can
      # be moved to different code after review. Each SHA below was verified
      # against the official action repository (see the runbook, §19a).
      # actions/checkout v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      # actions/setup-node v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          # Exact project runtime. `.node-version` and package.json#engines both
          # require 24.22.1; pinning the patch here keeps CI, operators and the
          # Render service on the same Node.
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - run: npm run db:seed
      - run: npm run db:migrate
      - run: npm run test:migrations
      - run: npm run test:backend
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # actions/upload-artifact v6.0.0
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: application-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
