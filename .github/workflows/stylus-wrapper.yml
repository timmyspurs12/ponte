name: Local Stylus wrapper diagnostics
on:
  push:
    branches: [arena/2f57c6df-ponte]
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust/stylus-wrapper
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.91.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Diagnostic execution and source transfer
        run: |
          python3 - <<'PY'
          import base64,gzip,io,tarfile,pathlib,subprocess
          logs=[]; fails=[]
          for cmd in [['cargo','fmt'],['cargo','test','--locked'],['cargo','run','--locked','--features','export-abi']]:
              p=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
              logs.append('COMMAND '+' '.join(cmd)+' EXIT '+str(p.returncode)+'\n'+p.stdout)
              fails.append(p.returncode)
          buf=io.BytesIO()
          with tarfile.open(fileobj=buf,mode='w:gz') as tar:
              for file in pathlib.Path('src').rglob('*.rs'): tar.add(file)
          pathlib.Path('/tmp/diag-source').write_text(base64.b64encode(buf.getvalue()).decode())
          data=base64.b64encode(gzip.compress('\n'.join(logs).encode())).decode()
          for i in range(0,len(data),3800): print(f'::notice title=LOG_{i//3800}::{data[i:i+3800]}')
          pathlib.Path('/tmp/diag-failed').write_text(str(int(any(fails))))
          PY
      - name: Transfer formatted source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/diag-source').read_text()
          for n in range(10):
              if 3800*n<len(s): print(f'::notice title=SRC_{n}::{s[3800*n:3800*(n+1)]}')
          PY
      - name: Preserve diagnostic failure
        run: exit "$(cat /tmp/diag-failed)"
